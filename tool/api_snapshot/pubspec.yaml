name: crux_api_snapshot
description: >-
  Internal developer tool that snapshots the public API surface of every
  crux-shared package so CI can diff it and surface breaking changes.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.0

dependencies:
  analyzer: ^8.4.0
  path: ^1.9.0

dev_dependencies:
  very_good_analysis: ^10.2.0
