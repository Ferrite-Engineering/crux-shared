name: crux_keybindings
description: Cross-suite customizable keyboard-binding infrastructure — platform-neutral binding model, keymap codec, conflict detection, and label formatting, generic over CruxAction.
version: 0.3.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  # confirmCruxDestructiveAction, the Reset All confirmation.
  crux_ide_layout:
    path: ../crux_ide_layout
  crux_shortcut_action:
    path: ../crux_shortcut_action
  # Reads the X server's vendor, extensions and keycode table through libX11
  # (`x_display_probe_ffi.dart`), to recognise an XQuartz display.
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  meta: ^1.15.0
  shared_preferences: ^2.2.0

dev_dependencies:
  crux_a11y:
    path: ../crux_a11y
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
