name: crux_issue_reporter
description: >-
  Cross-suite beta issue reporter for the EDACrux suite — diagnostic log ring
  buffer, structured category collection, screenshot capture, markdown report
  builder, and the pre-filled GitHub-issue submission dialog. One implementation
  consumed by NetCrux, LintCrux, and SimCrux (WaveCrux migration pending).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  crux_app_info:
    path: ../crux_app_info
  # `revealInFileManager`, for showing the saved screenshot: one reveal for
  # the suite, which resolves the file manager to an absolute path and passes
  # Explorer's `/select,` switch and the path as the single argument it needs.
  crux_io:
    path: ../crux_io
  # `TelemetryUncaughtErrorCounter`: the error handlers `captureFlutterErrors`
  # installs are the one place every uncaught error passes, so they are where
  # the `app.uncaught_error` count is taken.
  crux_telemetry:
    path: ../crux_telemetry
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  logging: ^1.2.0
  meta: ^1.15.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
