name: crux_telemetry
description: >-
  Cross-suite anonymous usage-statistics pipeline for the EDACrux suite —
  event model, disk-backed queue, coalescing batcher, ingest client, the
  beta × dev-flag × Enterprise-policy × consent gate, and the consent
  disclosure / settings surfaces. One implementation consumed by WaveCrux,
  NetCrux, LintCrux and SimCrux.
version: 0.5.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  # `CruxModalGate`, `CruxModalSurface` and `CruxScrollRegion`: what makes the
  # disclosure a dialog to a keyboard and a screen reader, shared with the
  # licence agreement so the two blocking surfaces cannot drift apart.
  crux_a11y:
    path: ../crux_a11y
  # `kBetaPeriod` (the dark-launch switch) and `licenseTierProvider` (the
  # `license_tier` envelope field). The gate is not meaningful without the
  # first, and the envelope is incomplete without the second.
  crux_license:
    path: ../crux_license
  # `CruxSettingsCard` / `CruxSettingsControlTile` — the shared grouped-row
  # chrome every product's Settings screen already renders. The Privacy section
  # ships here so the four products' telemetry toggles cannot drift apart.
  crux_settings_ui:
    path: ../crux_settings_ui
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  http: ^1.2.0
  meta: ^1.15.0
  # The on-disk queue lives in the application-support directory. Every method
  # degrades to a no-op where the plugin is unavailable (web), so this is a
  # hard dependency on the package but a soft one on the platform.
  path_provider: ^2.1.0
  # Random v4 installation ids, from `Random.secure()`. Never a host
  # fingerprint — see `mintTelemetryInstallationId`.
  uuid: ^4.5.3

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
