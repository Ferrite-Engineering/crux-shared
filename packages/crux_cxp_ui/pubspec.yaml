name: crux_cxp_ui
description: >-
  Cross-suite CXP cross-probe UI for the EDACrux suite — the one docked
  cross-probe side-panel (Connected Peers, Unreachable peers, Recent Events)
  all four products adopt, plus the app-agnostic controller contract it renders
  against. The Flutter companion to the pure-Dart crux_cxp protocol package.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  crux_cxp:
    path: ../crux_cxp
  # The send-failure toast.
  crux_ide_layout:
    path: ../crux_ide_layout
  # SettingsCodec / SettingsService, under which the CXP settings persist.
  crux_settings:
    path: ../crux_settings
  # CruxFormRow / CruxFormSection, which the settings controls are built on
  # (and, through it, CruxSwitch).
  crux_settings_ui:
    path: ../crux_settings_ui
  flutter:
    sdk: flutter
  # The shared CXP lifecycle is a set of root-container providers.
  flutter_riverpod: ^3.3.1
  meta: ^1.15.0
  shared_preferences: ^2.2.0

dev_dependencies:
  crux_a11y:
    path: ../crux_a11y
  # Renders the panel under a non-English locale in a test.
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
