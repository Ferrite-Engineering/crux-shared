name: crux_projects
description: Cross-suite multi-project workspace layer for the EDACrux suite — project descriptor/workspace models, the ProjectRegistry extension point, and per-project Riverpod scoping. One seam, four consumers; the persistent registry is the Pro overlays'.
version: 0.3.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  meta: ^1.15.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
