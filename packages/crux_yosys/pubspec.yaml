name: crux_yosys
description: Cross-suite Yosys subprocess infrastructure — runner, availability probe, stderr diagnostic parser, value types.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  # The spawn resolution every engine launch goes through. A relative path,
  # like every sibling dependency: products consume this package from
  # outside the workspace, where a bare constraint would resolve as hosted.
  crux_io:
    path: ../crux_io
  meta: ^1.15.0
  path: ^1.9.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^10.2.0
