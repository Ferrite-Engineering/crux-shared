name: crux_cxp
description: Cross-Tool eXchange Protocol (CXP) bindings — cross-probe gossip layer for the EDACrux suite.
version: 0.8.1
homepage: https://github.com/Ferrite-Engineering/crux-shared
repository: https://github.com/Ferrite-Engineering/crux-shared
issue_tracker: https://github.com/Ferrite-Engineering/crux-shared/issues
# crux_cxp is slated for pub.dev at the open-core flip, the one package in
# this repo meant for third parties. It stays `none` until then: `pub publish`
# needs a LICENSE inside this package. The remaining checklist is in
# CHANGELOG.md under "Publishing to pub.dev".
publish_to: 'none'

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  crux_io:
    path: ../crux_io
  crypto: ^3.0.0
  meta: ^1.15.0
  path: ^1.9.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^11.0.0
