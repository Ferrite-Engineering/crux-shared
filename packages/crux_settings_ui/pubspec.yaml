name: crux_settings_ui
description: >-
  Cross-suite master-detail Settings panel shell (category rail + detail pane)
  and grouped-row widgets for the EDACrux suite.
version: 0.2.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  crux_a11y:
    path: ../crux_a11y
  # showCruxDialog for the Settings shell, and the desktop tokens the form
  # rows read to choose their layout.
  crux_ide_layout:
    path: ../crux_ide_layout
  # Pure Dart, for PolicySource: CruxPolicyLock is keyed on the resolved
  # source. The edge runs this way only; crux_policy never imports UI.
  crux_policy:
    path: ../crux_policy
  crux_settings:
    path: ../crux_settings
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
