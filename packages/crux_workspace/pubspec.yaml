name: crux_workspace
description: Cross-suite workspace + multi-tab + split-pane infrastructure for the EDACrux suite.
version: 0.10.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  crux_io:
    path: ../crux_io
  crux_theme:
    path: ../crux_theme
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  meta: ^1.15.0
  path: ^1.9.0
  path_provider: ^2.1.0
  uuid: ^4.5.3

dev_dependencies:
  # Resolved-AST analysis for the static scope-leak guard in
  # test/static/per_tab_provider_scope_leak_test.dart. Pinned to the major
  # already resolved transitively suite-wide (12.1.0) so the lockfile does not
  # move.
  analyzer: ^13.3.0
  crux_a11y:
    path: ../crux_a11y
  # Test-only, and deliberately not a runtime dependency: the peers section
  # needs a display name and a brand colour, not licensing. The dev dependency
  # exists so one test can hold `CruxSuiteProduct` and `CruxProduct` to the same
  # four products in the same order.
  crux_license:
    path: ../crux_license
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
