name: crux_dock
description: >-
  Cross-suite tabbed dock for the EDACrux suite. A VSCode-style region
  container mounted inside a CruxIdeLayout region by every product (WaveCrux,
  NetCrux, LintCrux, SimCrux): a tab strip with badges and per-tab close, an
  auto-hiding single-tab header presentation, collapse / maximize / pop-out
  affordances, and auto-reveal of newly activated on-demand tabs. The package
  hard-codes no per-app content — hosts assemble CruxDockEntry lists from
  their own providers.
version: 0.1.1
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  # The region hint an empty panel inside the dock describes it with.
  crux_a11y:
    path: ../crux_a11y
  # The inspector's empty state (CruxPanelEmptyState) and its spoken notice
  # (announceCrux).
  crux_ide_layout:
    path: ../crux_ide_layout
  # The inspector's rows are CruxFormRows inside a CruxFormSection.
  crux_settings_ui:
    path: ../crux_settings_ui
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
