name: crux_theme
description: Cross-suite named-token color theming infrastructure for the EDACrux suite.
version: 0.3.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  crux_a11y:
    path: ../crux_a11y
  # The dialog and toast helpers the theme widgets open, and the theme
  # extensions (`CruxChromeColors`, `CruxDesktopTokens`) the shared chrome
  # reads. The edge runs this way only: crux_ide_layout never imports
  # crux_theme.
  crux_ide_layout:
    path: ../crux_ide_layout
  crux_io:
    path: ../crux_io
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  meta: ^1.15.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The pane resizer the chrome-token layout test drives.
  panes: ^1.3.0
  very_good_analysis: ^11.0.0
