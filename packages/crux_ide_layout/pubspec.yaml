name: crux_ide_layout
description: >-
  Cross-suite dockable IDE-layout shell (the panes IdeLayout + IdeController
  build/sync boilerplate) for the EDACrux suite. One CruxIdeLayout rendered by
  WaveCrux and future Crux products via a small read/write adapter.
version: 0.3.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  # The region hint a panel empty state uses to describe its region, and the
  # focus-walk harness the dialog and toast tests use.
  crux_a11y:
    path: ../crux_a11y
  # revealInFileManager, behind cruxRevealFile. A pure-Dart leaf, so the edge
  # adds no sibling dependency of its own.
  crux_io:
    path: ../crux_io
  flutter:
    sdk: flutter
  panes: ^1.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
