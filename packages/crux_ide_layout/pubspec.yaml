name: crux_ide_layout
description: >-
  Cross-suite dockable IDE-layout shell (the panes IdeLayout + IdeController
  build/sync boilerplate) for the EDACrux suite. One CruxIdeLayout rendered by
  WaveCrux and future Crux products via a small read/write adapter.
version: 0.3.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  crux_theme:
    path: ../crux_theme
  flutter:
    sdk: flutter
  panes: ^1.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  crux_a11y:
    path: ../crux_a11y
  flutter_localizations:
    sdk: flutter
  # Drives the token editor's own write path (`applyOverrides`) in the theme
  # tests.
  flutter_riverpod: ^3.3.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
