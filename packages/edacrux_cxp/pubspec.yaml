name: edacrux_cxp
description: >-
  A pure-Dart client for CXP 1.3 (specification revision 10), the protocol the
  EDACrux desktop apps use for cross-probing. Show a signal, highlight a net,
  open a scope or a source line, and hear selections back, from any Dart
  program.
version: 0.1.0
homepage: https://edacrux.app/cxp
repository: https://github.com/Ferrite-Engineering/crux-shared/tree/main/packages/edacrux_cxp
issue_tracker: https://github.com/Ferrite-Engineering/crux-shared/issues
topics:
  - eda
  - hardware
  - protocol
  - ipc
  - debugging

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  crypto: ^3.0.0
  meta: ^1.15.0
  path: ^1.9.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^11.0.0
