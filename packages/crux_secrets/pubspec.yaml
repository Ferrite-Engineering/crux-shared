name: crux_secrets
description: >-
  Cross-suite secret storage for the EDACrux suite — a narrow
  read/write/delete seam over the OS keychain (Keychain on macOS, DPAPI-backed
  credential storage on Windows, libsecret on Linux) plus an in-memory fake for
  tests. Consumed wherever a credential must never reach shared_preferences
  plain text: SimCrux PR-annotation auth tokens and the Enterprise shared-team
  database password in SimCrux and LintCrux.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
